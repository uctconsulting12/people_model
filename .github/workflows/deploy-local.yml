name: Local Deploy to Self-Hosted

on:
  push:
    branches: [ local ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -e
          docker build --pull -t people_image .
          docker image prune -f

      - name: Restart container
        run: |
          set -e
          docker stop people_container || true
          docker rm people_container || true
          docker run -d \
            --name people_container \
            -p 8002:8002 \
            --gpus all \
            people_image
